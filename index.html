<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a Tenerife Wonders</title>
    <meta name="description" content="Descubre Tenerife a tu propio ritmo con nuestras audioguías profesionales.">
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
        }
        
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--primary-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin: 1rem;
        }

        h1 {
            margin-top: 0;
            font-size: 2.2rem;
            color: var(--primary-color);
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 2rem;
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .guide-link {
            display: block;
            padding: 1rem 1.5rem;
            background-color: white;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .guide-link:hover {
            background-color: var(--accent-color);
            color: white;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to Tenerife Wonders! 🌴</h1>
        <p>Discover the island's most incredible spots at your own pace. Choose one of our immersive audio guides and start your adventure today..</p>
        
        <div class="links-grid">
            <a href="/candelaria_en/" class="guide-link">🎧 Audioguide Candelaria (English)</a>
            <a href="/anaga_en/" class="guide-link">🎧 Audioguide Anaga (English)</a>
            <!-- Puedes añadir más enlaces copiando la línea de arriba -->
        </div>

        <div class="footer">
            &copy; 2026 Tenerife Wonders. All rights reserved..
        </div>
    </div>

</body>
</html>
